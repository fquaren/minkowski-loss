# Prominent European precipitation / convective events inside the OPERA archive on disk.
# Used by scripts/dataset_v2/make_splits.py: every event window (+/- buffer) is forced into
# TEST, so no patch of these storms can reach training (DECISIONS §15), and the tiles that
# intersect `bbox` during the window form the `events_test` subset.
#
# Dates are UTC days (inclusive). bbox = [lat_min, lat_max, lon_min, lon_max], generous on
# purpose: the subset is then restricted to wet tiles, so a loose box only adds dry tiles.
# Sources were checked on 2026-09-28; the dates/regions below follow them. Radar coverage is
# not guaranteed (e.g. Italy's contribution to OPERA is partial); the split script reports
# how many covered, wet tiles each event actually has.
#
# `available: false` marks an event that has no data in the OPERA archive; it stays here
# for the record and is skipped by the split and window scripts.
#
# Shifted windows: where an event's grid tiles are never fully covered, the event subsets
# also get shifted 128 x 128 windows (scripts/dataset_v2/scan_event_windows.py).
events:
  - id: hymex_iop6_20120924
    name: "HyMeX IOP6 — fast linear MCS over southern France"
    type: [linear_mcs, heavy_rain, mediterranean]
    start: 2012-09-23
    end: 2012-09-25
    bbox: [42.5, 46.0, 2.0, 6.0]
    sources:
      - "Ducrocq et al. (2014) HyMeX-SOP1, BAMS 95, 1083-1100. doi:10.1175/BAMS-D-12-00244.1"
      - "Observational and modeling study of a MCS during HyMeX SOP1, Atmos. Res. https://www.sciencedirect.com/science/article/abs/pii/S0169809516306834"
