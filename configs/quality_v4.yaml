# v4 screen (DECISIONS §19, gate in §20). Every threshold the v4 build uses lives here, so a
# change is one diff. "provisional" = set before the Phase-0 calibration, to be confirmed there.
version: v4
data_dir: /home/fquareng/work/data/extremes/OPERA/quality_v4

ceiling:                      # rule 2
  min_count: 50               # per radar-year
  min_ratio: 5                # provisional; x the largest other count within +-window_db (Phase 0:
                              # known ceilings 9.9-89, other values 99.9th pct 1.96, max 13.7)
  window_db: 4.0              # > the coarsest ladder step in the data (~3 dB, IT 2026)
  table: ceilings.csv         # relative to data_dir; written by radar_screen_v4.py ceilings
  reject_pixels: 5            # tile-frame rejected at >= 5 ceiling pixels; 1-4 repaired (researcher, 2026-10-06)

repeat:                       # rule 1, per tile after all repairs
  u: 31.0
  min_count: 50               # ODYSSEY tail tiles: 99.9th percentile of the max count is 24
  min_excess: 10              # provisional; vs occupied values within +-0.5 dB (NIMBUS ladder)
  max_context: 0.5            # hourly (DECISIONS §23): not rejected when the ring around the repeated
                              # pixels is >= this x the value (a saturated core inside rain); provisional

guard:                        # rule 4
  max_size: 500               # provisional; components above this are not ring-median repaired

radar_frame:                  # rule 3, provisional until Phase 0
  min_valid: 500
  # flagged if (f31 >= f31_min and r2_range >= r2_min) or (max(ejump, bjump) >= jump_min and f10 >= f10_min)
  f31_min: 0.10
  r2_min: 0.5
  jump_min: 2.0
  f10_min: 0.2
  reject_share: 0.10          # reject a tile when flagged radars own >= this share of it
  temporal:                   # hourly (DECISIONS §23): a flag stands only if the radar is flagged in a
    min_wet_jump: 0.15        # neighbouring frame too, or its wet fraction exceeds both neighbours' by
                              # >= this. Provisional: 20 gallery cases (15/15 failures kept, 4/4 storms
                              # dropped; closest storm 0.13). Changes frame_flags on a rerun of `frames`.

radar_day:                    # rule 5: reviewed by the researcher (DECISIONS §19)
  review_top: 100
  exclusions: []              # entries: {radar: <key>, day: YYYYMMDD, reason: ..., reviewed: YYYY-MM-DD}
  reject_share: 0.10

known_failures:               # regression catalogue (DECISIONS §20, criterion 1)
  - name: madrid_20180429
    radar: estjv
    days: [20180429]
    signature: radar-wide failure, range-only field to 340 mm/h, raw cores to 1e4 mm/h
    check: no stored tile on these days with >= 10% owned by this radar and max >= 31
  - name: valjevo_ceiling_2023
    radar: rsval
    year: 2023
    value: 364.63
    signature: reflectivity ceiling (64.0 dBZ), speckle inside rain, 80 rain days
    check: no stored pixel equal to the value within 250 km of the radar that year
  - name: ceiling_4862_201911
    tile: [640, 1408]
    days: [20191114, 20191115, 20191116, 20191118, 20191121]
    value: 48.62
    signature: reflectivity ceiling (50.0 dBZ), stationary speckled blob, 7 days
    check: no stored tile with >= 5 pixels at the value on these days

hourly:                       # target = 1-h accumulation, ACRR convention (DECISIONS §21, §23; src/data/hourly.py)
  hot_fallback: keep          # hot pixel with no clean 5x5 neighbour: left as is and coded (v3: set to 0)
  max_size: 500               # guard, as guard.max_size
  ray_u: 1.0                  # multi-frame rays: thin (<= 3 px) lines >= 80 km through a radar site ...
  ray_half_window: 4          # ... at the same pixels (+-1 px) in >= ray_min_frames of t +- 4 frames
  ray_min_frames: 3           # provisional
  peak_u: 1.0                 # local peak: >= peak_u mm/h and >= peak_ratio x its 5x5 median
  peak_ratio: 2.0
  p1_min: 24                  # provisional: flagged when a local peak in >= 24 of 96 frames
                              # (16 daily-max tiles: artefacts 38-74, real cells 4-12, event rays 20-39)
  p1_ring_min: 12             # provisional: lower on climatological range rings
  p2_min: 12                  # provisional: rays inside rain = site-anchored lines of n_peak >= 12
  rules: {hot: true, spike: true, ceiling: true, footprint: true, ring: true, ray: true,
          persist: true, unsupported: true}
