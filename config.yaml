# --- I/O PATHS ---
RAW_OPERA_DATA_DIR: "/home/fquareng/work/data/extremes/OPERA/raw/OPERA"
METADATA_DIR: "/home/fquareng/work/data/extremes/OPERA"
PREPROCESSED_DATA_DIR: "/home/fquareng/work/data/extremes/OPERA/patches/precip"
DEM_DATA_DIR: "/home/fquareng/work/data/extremes/OPERA/patches/dem"
DEM_STATS: "/home/fquareng/work/data/extremes/OPERA/patches/dem/dem_stats.json"
STATIC_DEM_PATH: "/home/fquareng/work/data/extremes/OPERA/europe_dem_laea.tif"

TRAIN_METADATA_FILE: "/home/fquareng/work/data/extremes/OPERA/train_patches_metadata.txt"
VAL_METADATA_FILE: "/home/fquareng/work/data/extremes/OPERA/val_patches_metadata.txt"
TEST_METADATA_FILE: "/home/fquareng/work/data/extremes/OPERA/test_patches_metadata.txt"

# --- PHYSICAL PREPROCESSING ---
PRECIP_VAR_NAME: "TOT_PREC"
PATCH_SIZE: 128
DOWNSCALING_FACTOR: 12.5   # ERA5-like to OPERA (25km / 2km)
PIXEL_SIZE_KM: 2.0
DRIZZLE_THRESHOLD: 0.1     # mm/h — sensor noise floor
DECLUTTER_THRESHOLD: 150.0  # mm/h — unphysical upper bound
WORKER_CHUNK_SIZE: 250
PREPROCESS_BATCH_SIZE: 1000  # batch size for Zarr preprocessing (distinct from training)

SPLIT_RATIOS:
  train: 0.8
  validation: 0.1
  test: 0.1

# --- TOPOLOGY CONFIGURATION ---
# "euler" = chi = B0 - B1 (Euler characteristic, matches analytical approx.)
# "b0"    = connected components only (original paper setup)
TOPOLOGY_MODE: "euler"

# Climatological quantile levels for Minkowski functional thresholds.
# These are quantiles of the wet-pixel CDF, mapped to physical mm/h thresholds.
# Option 3: fixed, log-spaced physical excursion-set thresholds (mm/h), drizzle floor
# to just past the observed extreme (top-1% patch max ~120 mm/h). The analytical loss
# integrates over log-intensity, i.e. equal weight per decade. Calibrate the top end to
# your observed extreme and, ideally, align with the POT/FSS evaluation levels.
PHYSICAL_THRESHOLDS: [
  0.1, 0.17, 0.28, 0.48, 0.81, 1.4, 2.3, 3.9, 6.5, 11, 19, 31, 53, 89, 150
]

# QUANTILE_LEVELS is retained only for the legacy emulator path; the analytical /
# super-resolution loss and gamma targets are now defined by PHYSICAL_THRESHOLDS above.
QUANTILE_LEVELS: [
  0.01, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45,
  0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 0.99
]

# --- EMULATOR ---
ARCHITECTURE: "Constrained"  # "Baseline", "Lipschitz", or "Constrained"
EMULATOR_CHECKPOINT_PATH: "/home/fquareng/work/ch2/minkowski-loss/runs/emulator/Emulator_Constrained_single_2026-05-12_09-13-07/best_model_checkpoint.pth"  # set after training

# Mixup augmentation
MIXUP_ALPHA: 0.2
NOISE_STD: 0.05

# --- TRAINING (shared defaults) ---
DEVICE: "cuda"
NUM_WORKERS: 4
MAX_WORKERS: 4
BATCH_SIZE: 128
NUM_EPOCHS: 25
PATIENCE: 5  # super-resolution
EARLY_STOPPING_PATIENCE: 15  # emulator

# Dataset balancing
WET_DRY_RATIO: 1.0

# --- MINKOWSKI LOSS CONFIGURATION ---
MINKOWSKI_TARGET_WEIGHT: 0.0001   # 0 = MSE only; >0 = MSE + geometric loss
MINKOWSKI_WARMUP_EPOCHS: 3        # epochs before geometric loss activates
TRUST_TAU: 0.005725               # trust gating coefficient for emulator loss

# --- EXPERIMENT ---
EXPERIMENT_NAME: "Extremes"

BACKBONE_CHECKPOINT: "/home/fquareng/work/ch2/minkowski-loss/runs/sr_analytical/UNet_Ana_20260623_144958/unet_best.pth"
REWARD_MODE: "distributional"   # "distributional" | "per_sample"  <- the paper's ablation axis
REWARD_K: 1                     # ODE steps carrying gradients (DRaFT-K); memory scales with K
REWARD_ENSEMBLE: 4              # members per condition; distributional matching needs M > 1
REWARD_WEIGHT: 1.0e-3           # weight on the structural reward
REWARD_PROXIMAL_WEIGHT: 1.0     # trust region to the frozen clean model; raise if it drifts
REWARD_SPREAD_WEIGHT: 0.5       # weight of the ensemble-spread term (distributional mode)
REWARD_ANNEAL: 0.05             # threshold sharpness for the differentiable functionals
REWARD_LR: 1.0e-5               # fine-tuning learning rate (small: this is not from-scratch)
REWARD_EPOCHS: 8                # changed from original 5 to allow more time for the reward to converge; early stopping is still in place
REWARD_BATCH_SIZE: 8            # keep small: memory ~ B x M x K forward graphs
REWARD_VAL_BATCHES: 20
REWARD_GRAD_CHECKPOINT: true

REWARD_STEPS_PER_EPOCH: 500    # ~7.7 s/step measured -> a full split would be ~600 h/epoch

# Reward-hacking guards, evaluated on held-out data and NOT part of the reward, so they
# cannot be optimised away. Training aborts if either is exceeded.
# These are calibrated automatically from the frozen clean model: absolute constants do
# NOT transfer, because measured OPERA baselines are anisotropy ~1.87 (backbone) and ~31
# (bicubic) -- the coarse input carries grid-aligned interpolation structure. Leave the
# two MAX keys null to auto-calibrate; set them only to override.
REWARD_GUARD_AUTO: true
REWARD_GUARD_FACTOR: 1.3        # bound = factor x the clean reference model's own value
REWARD_GUARD_BATCHES: 8
REWARD_ANISO_MAX: null          # absolute override (null => auto)
REWARD_PEAK_RATIO_MAX: null     # absolute override (null => auto)

# ------ Losses -------

STRUCTURAL_LOSS: "minkowski"
STRUCTURAL_LOSS_WEIGHTS:   # per-loss w_max (2026-09-23, Adam-share matched to Minkowski 1e-4;
  minkowski: 1.0e-4         # see src/losses/competing.py DEFAULT_STRUCTURAL_WEIGHTS)
  spectral: 1.0e-1
  ssim: 2.0e-2
  wetarea: 2.0e-2
  opticalflow: 2.5e-2
 
# spectral (FFT magnitude, kernel-CRPS form). With a deterministic backbone there is one
# member, so this reduces to an L1 between magnitude spectra. NOTE: Fourier magnitude is
# translation-invariant, so this loss cannot penalise displacement at all.
SPECTRAL_ALPHA: 1.0
 
# ssim (structural similarity, log-normalised space)
SSIM_WINDOW: 11
 
# wetarea (soft wet/dry agreement, physical mm/h). The threshold must be the drizzle
# level and the temperature well below it: at threshold 0 a dry pixel scores 0.5 wet.
WETAREA_TEMPERATURE: 0.05
WETAREA_FP_WEIGHT: 1.0
WETAREA_FN_WEIGHT: 1.0
 
# opticalflow (advection consistency against the coarse conditioning field). Cost scales
# as (2*OF_SEARCH_RADIUS+1)^2 correlation volumes per step; the flow itself is an argmin
# and carries no gradient, only the prediction-to-teacher term does.
OF_PATCH_SIZE: 21
OF_SEARCH_RADIUS: 4
OF_DOWNSAMPLE: 4
OF_MASK_THRESHOLD: 0.1

# Reward form. "energy" is the kernel-CRPS / energy score on the functional curves, using
# the Minkowski distance as the metric. It is a proper score for the distribution of gamma:
# verified empirically to be minimised at the true ensemble dispersion, whereas per_sample
# prefers zero spread (the diversity-collapse mechanism).
#   per_sample | distributional | energy
REWARD_MODE: "energy"
REWARD_ENSEMBLE: 16       # the fair estimator needs M >= 2; pairwise term wants M large
REWARD_SPREAD_WEIGHT: 0.0 # ignored in energy mode: the negative pairwise term IS the spread reward

# Data-fidelity retention. The reward is rigid-motion invariant and the proximal anchor
# constrains the velocity field, so without this term NOTHING in the objective determines
# where rain falls -- which is what the fractions skill score measures, and what regressed
# in both Phase-3 routes. This re-adds the flow-matching velocity loss on the real residual.
# Set to 0.0 only to reproduce the earlier (placement-free) configuration.
REWARD_FM_RETENTION_WEIGHT: 1.0
